apply plugin: 'com.android.application'

// Release signing credentials. NEVER committed — keystore.properties and
// the .jks itself are gitignored; keystore.properties.example is the
// committed template. Resolution order:
//   1. RITUAL_KEYSTORE_* environment variables (CI / one-off overrides)
//   2. android/keystore.properties (per-machine file, like local.properties)
// Same pattern as saam/android (Beka), proven through Play internal testing.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksPath = System.getenv('RITUAL_KEYSTORE_FILE') ?: keystoreProps['storeFile']
def ksPassword = System.getenv('RITUAL_KEYSTORE_PASSWORD') ?: keystoreProps['storePassword']
def ksAlias = System.getenv('RITUAL_KEYSTORE_ALIAS') ?: keystoreProps['keyAlias']
def ksAliasPassword = System.getenv('RITUAL_KEYSTORE_ALIAS_PASSWORD') ?: keystoreProps['keyPassword']

android {
    namespace = "com.ritualhabits.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ritualhabits.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "1.0.46"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksAliasPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Fail LOUDLY when a release build has no signing credentials. Without this,
// a missing keystore.properties yields an unsigned aab whose only symptom is a
// Play upload rejection much later. (Copied from saam/android — same failure
// was hit for real there.)
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.name.contains('Release') && (it.name.startsWith('bundle') || it.name.startsWith('assemble')) }
    if (buildingRelease && ksPath == null) {
        throw new GradleException(
            "Release build requested but no signing credentials found. " +
            "Create android/keystore.properties from keystore.properties.example, " +
            "or set RITUAL_KEYSTORE_FILE / RITUAL_KEYSTORE_PASSWORD / " +
            "RITUAL_KEYSTORE_ALIAS / RITUAL_KEYSTORE_ALIAS_PASSWORD."
        )
    }
}
