<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Ritual</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ritual" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme colour for browser chrome & Android -->
    <meta name="theme-color" content="#C17B4E" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#C17B4E" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- PIN input flex fix: overrides inline maxWidth:60 so boxes fill full width -->
    <style>input[type=tel]{flex:1 1 0!important;max-width:none!important;min-width:0!important}</style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
